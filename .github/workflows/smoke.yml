name: Smoke

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  smoke:
    name: ${{ matrix.label }} / Python 3.10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS
          - os: ubuntu-latest
            label: Linux
    timeout-minutes: 10
    env:
      CLILANE_TMUX_SOCKET: clilane-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Define isolated paths
        shell: bash
        run: |
          printf 'CLILANE_STATE_HOME=%s\n' "$RUNNER_TEMP/clilane-state" >> "$GITHUB_ENV"
          printf 'TMUX_TMPDIR=%s\n' "$RUNNER_TEMP/clilane-tmux" >> "$GITHUB_ENV"
          printf 'XDG_CONFIG_HOME=%s\n' "$RUNNER_TEMP/clilane-config" >> "$GITHUB_ENV"

      - name: Install tmux
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update
            sudo apt-get install -y tmux
          fi

      - name: Verify isolated environment
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          case "$CLILANE_TMUX_SOCKET" in
            clilane-ci-[0-9]*-[0-9]*) ;;
            *) echo "unsafe CI tmux socket" >&2; exit 1 ;;
          esac
          case "$CLILANE_STATE_HOME" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "unsafe CI state path" >&2; exit 1 ;;
          esac
          case "$TMUX_TMPDIR" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "unsafe CI tmux path" >&2; exit 1 ;;
          esac
          test "$CLILANE_STATE_HOME" != "$TMUX_TMPDIR"
          install -d -m 0700 \
            "$CLILANE_STATE_HOME" \
            "$TMUX_TMPDIR" \
            "$XDG_CONFIG_HOME/clilane"
          python3 - "$CLILANE_STATE_HOME" "$TMUX_TMPDIR" <<'PY'
          import os
          import sys

          for path in sys.argv[1:]:
              assert os.stat(path).st_mode & 0o777 == 0o700, path
          PY
          reported_version="$(./bin/clilane --version)"
          version="${reported_version#clilane }"
          test "$reported_version" = "clilane $version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'CLILANE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          ./bin/clilane --help | grep -F "~/projects/sample-app" >/dev/null
          python3 -c 'import sys; assert sys.version_info >= (3, 10)'
          tmux -V

      - name: Exercise clean profiles
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v tests.test_profiles

      - name: Exercise release workflow contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v tests.test_release

      - name: Exercise provider evidence contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v tests.test_provider_evidence

      - name: Exercise lifecycle and local fleet
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            ./bin/clilane rm ci-smoke --force --grace 0 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT HUP INT TERM

          task_cwd="$RUNNER_TEMP/task with space"
          install -d -m 0700 "$task_cwd"
          ./bin/clilane run ci-smoke -C "$task_cwd" -- /bin/cat
          ./bin/clilane status ci-smoke --json > "$RUNNER_TEMP/status.json"

          python3 - "$RUNNER_TEMP/status.json" "$task_cwd" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          status = json.loads(Path(sys.argv[1]).read_text())
          assert status["name"] == "ci-smoke"
          assert status["state"] == "running"
          assert status["command"] == ["/bin/cat"]
          assert status["cwd"] == str(Path(sys.argv[2]).resolve())
          assert isinstance(status["pid"], int) and status["pid"] > 0
          assert status["exit_code"] is None
          assert status["signal"] is None
          assert Path(status["log"]).is_relative_to(
              Path(os.environ["CLILANE_STATE_HOME"])
          )
          PY

          marker="clilane-ci-marker"
          ./bin/clilane send ci-smoke "$marker"
          deadline=$((SECONDS + 10))
          while true; do
            ./bin/clilane read ci-smoke --all > "$RUNNER_TEMP/read.txt"
            ./bin/clilane log ci-smoke --lines 20 > "$RUNNER_TEMP/log.txt"
            if grep -Fq "$marker" "$RUNNER_TEMP/read.txt" && \
               grep -Fq "$marker" "$RUNNER_TEMP/log.txt"; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "task output was not captured before timeout" >&2
              exit 1
            fi
            sleep 0.2
          done

          fleet_config="$XDG_CONFIG_HOME/clilane/fleet.json"
          printf '%s\n' \
            '{"schema_version":1,"hosts":[{"name":"ci-local","transport":"local"}]}' \
            > "$fleet_config"
          ./bin/clilane fleet --config "$fleet_config" --json \
            > "$RUNNER_TEMP/fleet.json"

          python3 - "$RUNNER_TEMP/status.json" "$RUNNER_TEMP/fleet.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          status = json.loads(Path(sys.argv[1]).read_text())
          fleet = json.loads(Path(sys.argv[2]).read_text())
          assert fleet["schema_version"] == 1
          assert fleet["complete"] is True
          assert len(fleet["hosts"]) == 1
          host = fleet["hosts"][0]
          assert host["name"] == "ci-local"
          assert host["status"] == "ok"
          assert host["clilane_version"] == os.environ["CLILANE_VERSION"]
          assert host["error"] is None
          assert len(host["tasks"]) == 1
          assert host["tasks"][0] == status
          PY

          ./bin/clilane fleet --config "$fleet_config" status ci-local:ci-smoke \
            > "$RUNNER_TEMP/fleet-status.json"
          python3 - "$RUNNER_TEMP/fleet-status.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = json.loads(Path(sys.argv[1]).read_text())
          assert status["name"] == "ci-smoke"
          assert status["state"] == "running"
          PY
          ./bin/clilane fleet --config "$fleet_config" log ci-local:ci-smoke \
            --lines 20 | grep -Fq "$marker"
          rc=0
          ./bin/clilane fleet --config "$fleet_config" status ci-local:ghost \
            >/dev/null 2>&1 || rc=$?
          test "$rc" = "1"
          rc=0
          ./bin/clilane fleet --config "$fleet_config" log nohost:ci-smoke \
            >/dev/null 2>&1 || rc=$?
          test "$rc" = "1"

          ./bin/clilane stop ci-smoke --grace 1
          ./bin/clilane status ci-smoke --json > "$RUNNER_TEMP/stopped.json"
          python3 - "$RUNNER_TEMP/stopped.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = json.loads(Path(sys.argv[1]).read_text())
          assert status["state"] == "stopped"
          assert status["pid"] is None
          PY

          ./bin/clilane rm ci-smoke
          ./bin/clilane list --json > "$RUNNER_TEMP/final.json"
          python3 - "$RUNNER_TEMP/final.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          assert json.loads(Path(sys.argv[1]).read_text()) == []
          PY
          if tmux -L "$CLILANE_TMUX_SOCKET" -f /dev/null has-session \
              >/dev/null 2>&1; then
            echo "isolated tmux server still has a session" >&2
            exit 1
          fi

      - name: Exercise wait, key, and orphan recovery
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            ./bin/clilane rm ci-keys --force --grace 0 >/dev/null 2>&1 || true
            ./bin/clilane rm ci-crash --force --grace 0 >/dev/null 2>&1 || true
            ./bin/clilane rm ci-hook --force --grace 0 >/dev/null 2>&1 || true
            ./bin/clilane rm ci-sig --force --grace 0 >/dev/null 2>&1 || true
            ./bin/clilane rm ci-trap --force --grace 0 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT HUP INT TERM

          rc=0
          ./bin/clilane run ci-exit --wait -- /nonexistent/ci-binary || rc=$?
          test "$rc" = "127"
          ./bin/clilane rm ci-exit
          ./bin/clilane run ci-true --wait -- /usr/bin/true
          ./bin/clilane rm ci-true

          rc=0
          ./bin/clilane run ci-hook -C "$RUNNER_TEMP" \
            --on-exit 'echo "$CLILANE_TASK_NAME:$CLILANE_EXIT_CODE:$CLILANE_SIGNAL" > hook.out' \
            --wait -- sh -c 'exit 3' || rc=$?
          test "$rc" = "3"
          test "$(cat "$RUNNER_TEMP/hook.out")" = "ci-hook:3:"
          ./bin/clilane rm ci-hook
          ./bin/clilane run ci-sig -C "$RUNNER_TEMP" \
            --on-exit 'echo "$CLILANE_SIGNAL:$CLILANE_EXIT_CODE" > sig.out' \
            -- sleep 300
          ./bin/clilane stop ci-sig --grace 2
          sleep 1
          test "$(cat "$RUNNER_TEMP/sig.out")" = "SIGTERM:143"
          ./bin/clilane rm ci-sig
          ./bin/clilane run ci-trap -C "$RUNNER_TEMP" \
            --on-exit 'trap "echo trapped > trap.out; exit 0" TERM; sleep 25 & wait $!' \
            -- /usr/bin/true
          sleep 1
          ./bin/clilane stop ci-trap --grace 8
          test "$(cat "$RUNNER_TEMP/trap.out")" = "trapped"
          ./bin/clilane status ci-trap --json | python3 -c '
          import json, sys
          status = json.load(sys.stdin)
          assert status["exit_code"] == 0 and status["signal"] is None, status'
          ./bin/clilane rm ci-trap

          ./bin/clilane run ci-keys -- /bin/cat
          rc=0
          ./bin/clilane send ci-keys "$(printf '\033')" || rc=$?
          test "$rc" = "1"
          rc=0
          ./bin/clilane send ci-keys "" || rc=$?
          test "$rc" = "1"
          ./bin/clilane key ci-keys Escape Up C-c
          ./bin/clilane wait ci-keys --timeout 10 || true
          ./bin/clilane rm ci-keys --force --grace 0

          ./bin/clilane run ci-crash -- sh -c 'echo ci-crash-marker; sleep 300'
          sleep 1
          crash_log="$(./bin/clilane status ci-crash --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["log"])')"
          grep -Fq ci-crash-marker "$crash_log"
          server_pid="$(tmux -L "$CLILANE_TMUX_SOCKET" -f /dev/null display-message -p '#{pid}')"
          kill -9 "$server_pid"
          sleep 1
          test "$(./bin/clilane list)" = "no tasks"
          ./bin/clilane orphans | grep -Fq ci-crash
          ./bin/clilane clean
          test -f "$crash_log"
          ./bin/clilane clean --orphans
          test ! -f "$crash_log"
          test "$(./bin/clilane orphans)" = "no orphaned tasks"

      - name: Exercise the native switcher
        run: python3 tests/hub_pty.py

      - name: Clean isolated task
        if: always()
        shell: bash
        run: |
          case "$CLILANE_TMUX_SOCKET" in
            clilane-ci-[0-9]*-[0-9]*) ;;
            *) exit 1 ;;
          esac
          if test -x ./bin/clilane; then
            ./bin/clilane rm ci-smoke --force --grace 0 >/dev/null 2>&1 || true
          fi

  release:
    name: Publish immutable release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          reported_version="$(./bin/clilane --version)"
          version="${reported_version#clilane }"
          if [ "$reported_version" != "clilane $version" ] || \
             [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid executable version: $reported_version" >&2
            exit 1
          fi
          tag="v$version"
          if [ "$GITHUB_REF" != "refs/tags/$tag" ] || \
             [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "release tag $GITHUB_REF_NAME does not match executable version $version" >&2
            exit 1
          fi
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          ref_commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          if [ "$head_commit" != "$GITHUB_SHA" ] || \
             [ "$ref_commit" != "$GITHUB_SHA" ]; then
            echo "release ref does not resolve to checked-out commit $GITHUB_SHA" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Build deterministic release assets
        id: assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          archive_name="clilane-$RELEASE_VERSION.tar.gz"
          archive="$release_dir/$archive_name"
          verification="$RUNNER_TEMP/$archive_name.verification"
          checksum="$archive.sha256"
          install -d -m 0700 "$release_dir"
          LC_ALL=C git -c tar.umask=0022 archive --format=tar \
            --prefix="clilane-$RELEASE_VERSION/" "$GITHUB_SHA" | \
            gzip -n -9 > "$archive"
          LC_ALL=C git -c tar.umask=0022 archive --format=tar \
            --prefix="clilane-$RELEASE_VERSION/" "$GITHUB_SHA" | \
            gzip -n -9 > "$verification"
          if ! cmp -s "$archive" "$verification"; then
            echo "release archive is not deterministic" >&2
            exit 1
          fi
          python3 - "$archive" "$checksum" "$archive_name" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          checksum = Path(sys.argv[2])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          checksum.write_text(f"{digest}  {sys.argv[3]}\n", encoding="ascii")
          PY
          printf 'artifact=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"
          printf 'checksum_name=%s\n' "$archive_name.sha256" >> "$GITHUB_OUTPUT"

      - name: Refuse release conflicts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_ARTIFACT_NAME: ${{ steps.assets.outputs.artifact_name }}
          RELEASE_CHECKSUM_NAME: ${{ steps.assets.outputs.checksum_name }}
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          python3 - "$releases" "$RELEASE_TAG" \
            "$RELEASE_ARTIFACT_NAME" "$RELEASE_CHECKSUM_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path

          pages = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          releases = [release for page in pages for release in page]
          tag, artifact, checksum = sys.argv[2:]
          conflicts = []
          for release in releases:
              if release.get("tag_name") == tag:
                  state = "draft" if release.get("draft") else "release"
                  conflicts.append(f"existing {state} {tag}")
              names = {asset.get("name") for asset in release.get("assets", [])}
              conflicts.extend(
                  f"existing asset {name}"
                  for name in (artifact, checksum)
                  if name in names
              )
          if conflicts:
              raise SystemExit("release publication refused: " + ", ".join(conflicts))
          PY

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_ARTIFACT: ${{ steps.assets.outputs.artifact }}
          RELEASE_CHECKSUM: ${{ steps.assets.outputs.checksum }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ARTIFACT" "$RELEASE_CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Immutable CLI Lane release $RELEASE_TAG. Homebrew update remains manual."
